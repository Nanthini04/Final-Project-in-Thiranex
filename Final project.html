<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartShop</title>

  <link rel="stylesheet" href="Final project.css">

  <script src="https://kit.fontawesome.com/6f6f8b4f76.js" crossorigin="anonymous"></script>
</head>

<body>

<header>

  <h1>🛍 SmartShop</h1>

  <nav>

    <a href="#">Home</a>

    <a href="#">Products</a>

    <a href="#">Cart</a>

  </nav>

  <div class="actions">

    <input
      type="text"
      id="searchInput"
      placeholder="Search products">

    <button id="darkMode">

      🌙

    </button>

  </div>

</header>


<section class="categories">

  <button class="category active">All</button>

  <button class="category">Electronics</button>

  <button class="category">Accessories</button>

  <button class="category">Wearables</button>

</section>


<section id="productContainer">

</section>


<div class="cart">

  🛒 Cart:

  <span id="cartCount">

    0

  </span>

</div>

<script src="Final project.js"></script>

</body>

</html>
